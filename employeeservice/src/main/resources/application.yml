server:
  port: 8081

spring:
  application:
    name: employee-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employeeservicesoa?sslmode=disable}
    username: postgres
    password: pass
  jpa:
    hibernate:
      ddl-auto: create-drop

  graphql:
    graphiql:
      enabled: true
      path: /graphiql

    cors:
      allowed-origins: "*"
      allowed-methods: "*"




eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    # hostname: localhost
    preferIpAddress: true
