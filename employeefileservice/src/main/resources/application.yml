server:
  port: 8082
  forward-headers-strategy: framework

  
spring:
  application:
    name: employee-file-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employeefileservicesoa?sslmode=disable}
    username: postgres
    password: pass
  jpa:
    hibernate:
      ddl-auto: create-drop



eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    # hostname: localhost
    preferIpAddress: true